function forget() { try { localStorage.removeItem(KEY); } catch (_) {} }
async function show(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bin(D.salt), iterations: D.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bin(D.iv) }, key, bin(D.ct));
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(plain), "text/html");
  document.head.replaceWith(doc.head);
  document.body.replaceWith(doc.body);
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("p").value, keep = document.getElementById("k").checked;
  try {
    await show(pw);
    if (keep) { save(pw); auto(); } else forget();
  } catch (_) {
    document.getElementById("err").hidden = false;
  }
});
function auto() { setTimeout(() => location.reload(), 30 * 60000); }
// URL の最後に「#パスワード」が付いていれば、入力なしで開く（# から後はサーバーへ送られない）
let fromUrl = "";
try { fromUrl = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
if (fromUrl) {
  show(fromUrl).then(() => { save(fromUrl); history.replaceState(null, "", location.pathname); auto(); })
    .catch(() => { document.getElementById("err").hidden = false; });
} else {
  const pw = saved();
  if (pw) show(pw).then(auto).catch(forget);
}
</script>
